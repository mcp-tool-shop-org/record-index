# ⚑ THE FILENAME IS LOAD-BEARING. PyPI Trusted Publishing binds an OIDC subject
# to `mcp-tool-shop-org/record-index` PLUS this exact workflow filename. Rename
# this file and the token exchange fails and nothing can publish; the fix is
# always to restore the name, never to loosen the trust configuration.
#
# WRITING THIS FILE PUBLISHES NOTHING. It is inert until a GitHub release
# exists: the trigger is `release: published` and there is no push trigger, so a
# tag on its own does not reach it either.
#
# NO TOKENS AND NO SECRETS. The job exchanges GitHub's OIDC identity for a
# short-lived PyPI credential, which is why `id-token: write` is the only
# elevated permission here and why there is no API token to leak or rotate.
name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # the OIDC identity, and nothing else
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: What is about to be published
        run: ls -l dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
