name: CI

# PATHS-GATED, never "all pushes". The workflow file itself is in the filter so
# a change to CI is tested by CI; workflow_dispatch is the manual fallback.
on:
  push:
    paths:
      - "pyproject.toml"
      - "record_index/**"
      - "tests/**"
      - ".github/workflows/**"
      - "atlas/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "record_index/**"
      - "tests/**"
      - ".github/workflows/**"
      - "atlas/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # THE FLOOR AND THE CEILING, and nothing between them. `requires-python`
      # says >=3.11, so 3.11 is the oldest interpreter this package promises to
      # install on and 3.13 is the newest it claims in its classifiers. A matrix
      # that tested only one of them would leave half the promise unmeasured.
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on both cells, so it is
      # checked on the 3.13 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.13'
        run: npx --yes @dogfood-lab/atlas@1.21.0 check

      # pytest is installed HERE rather than declared as an extra. The runtime
      # dependency list is empty and that is a property the package is sold on:
      # a consuming repo installs one package and inherits no transitive
      # surface. A test extra would put pytest in the project metadata, and the
      # suite asserts that the list stays empty.
      - name: Install the package and the test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      - name: Show what is installed
        run: python -m pip list

      - name: Run the suite
        id: tests
        run: python -m pytest tests -q ${{ env.COVERAGE_LEG == 'true' && '--cov=record_index --cov-report=term --cov-report=xml' || '' }} --junitxml=junit.xml

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.test.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml
