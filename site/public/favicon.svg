<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="record-index">
  <!-- Drawn for 32px, not downscaled from anything. The mark is the record as
       rows and the query as the one row the index points at. -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <g fill="#52525b">
    <rect x="7" y="8" width="18" height="3" rx="1.5"/>
    <rect x="7" y="14.5" width="18" height="3" rx="1.5"/>
    <rect x="7" y="21" width="18" height="3" rx="1.5"/>
  </g>
  <rect x="7" y="14.5" width="11" height="3" rx="1.5" fill="#8b5cf6"/>
  <circle cx="23.5" cy="16" r="3.5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
</svg>
